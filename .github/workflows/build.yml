# Checks and builds an app for tirohealth.app, and on pushes to the default branch deploys it.
#
# The app repo calls it from its own workflow:
#
#   name: Tiro.health
#   on:
#     push:
#       branches: [main]
#       tags: ["v*"]
#     pull_request:
#     workflow_dispatch:   # Tiro.health starts the first publish once the app is set up
#   jobs:
#     app:
#       name: App
#       uses: Tiro-health/ehr-app-build/.github/workflows/build.yml@v2
#       with:
#         app: ${{ vars.TIRO_EHR_APP_NAME }}   # set by the EHR's setup page when you link the repository
#       # The publish job signs in to Google Cloud with the run's GitHub identity. A called
#       # workflow gets no more permissions than the calling job grants, so grant these here.
#       permissions:
#         contents: read
#         id-token: write
#
# GitHub names each check `<caller workflow> / <caller job> / <job here>`, so with the caller
# above the checks read "Tiro.health / App / Build" and "Tiro.health / App / Publish".
#
# The `build` job runs `check` and `build` and packages the output into an image with
# scripts/package.sh (run it from an app repository to get the same image locally). On pushes
# to the default branch or v* tags, and on manual runs of the default branch, it uploads the image
# as the artifact `tiro-image` (kept one day). Pull requests are checked and built but not uploaded.
#
# The `publish` job runs on pushes to, and manual runs of, the default branch. It runs none of the
# app's code: it loads the `tiro-image` artifact, pushes the image as the deploy account of the app
# named by the `app` input, and rolls a new revision of the app container. Without `app` the
# repository is not set up on Tiro yet: the job passes with a notice that links the EHR's setup
# page, and deploys nothing. It takes scripts/publish.sh from the v2 tag, never from
# `tooling-ref`. See the README.
#
# Build contract:
# - npm (package-lock.json) or pnpm (pnpm-lock.yaml, version from "packageManager").
# - "check" and "build" scripts. Both must pass.
# - The build produces .output/server/index.mjs (Node server, e.g. TanStack Start with
#   Nitro, listening on $PORT) or dist/index.html (static single-page app, served by nginx
#   with unknown paths falling back to index.html).

name: Tiro.health app

on:
  workflow_call:
    inputs:
      tooling-ref:
        description: >-
          Ref of Tiro-health/ehr-app-build to take scripts/package.sh from in the build job. The
          publish job ignores it and always uses v2.
        type: string
        default: v2
      app:
        description: >-
          The Tiro app to deploy, as named on the EHR's setup page. Pass
          `vars.TIRO_EHR_APP_NAME`, which the setup page sets. Without it the publish job deploys
          nothing and links the setup page in a notice.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.package.outputs.image }}
    steps:
      - name: Check out the app
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          # Its automatic cache needs pnpm installed first; corepack installs it below.
          package-manager-cache: false

      - name: Install
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            echo "RUN=pnpm" >> "$GITHUB_ENV"
            pnpm install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            echo "RUN=npm run" >> "$GITHUB_ENV"
            npm ci
          else
            echo "::error::No pnpm-lock.yaml or package-lock.json found."
            exit 1
          fi

      - name: Check
        run: $RUN check

      - name: Build
        run: $RUN build

      # scripts/package.sh lives in this repository; the same script builds the image on a laptop.
      - name: Get the Tiro.health build tools
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: Tiro-health/ehr-app-build
          ref: ${{ inputs.tooling-ref }}
          path: tiro-build-tooling
          persist-credentials: false

      - name: Package image
        id: package
        run: |
          # <repository>:<tag> for a v* tag, <repository>:<commit> otherwise.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then version="$GITHUB_REF_NAME"; else version="$GITHUB_SHA"; fi
          tiro-build-tooling/scripts/package.sh \
            --image "${GITHUB_REPOSITORY#*/}:$version" \
            --tar "$RUNNER_TEMP/out/image.tar.gz"

      - name: Upload image
        if: >-
          (github.event_name == 'push' &&
          (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))) ||
          (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tiro-image
          path: ${{ runner.temp }}/out/image.tar.gz
          retention-days: 1
          # Already gzipped.
          compression-level: 0

  publish:
    name: Publish
    needs: build
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # One deploy at a time per repository, so an older commit never rolls out after a newer one.
    concurrency:
      group: tiro-publish-${{ github.repository }}
      cancel-in-progress: false
    steps:
      # The script runs with the app's deploy identity, so it always comes from the v2 tag (the
      # ref the deploy accounts trust), never from `tooling-ref`. The app's repository is never
      # checked out.
      - name: Get the Tiro.health build tools
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: Tiro-health/ehr-app-build
          ref: v2
          path: tiro-build-tooling
          persist-credentials: false

      # Without an app name it writes publish=false and every later step is skipped.
      - name: Check app name
        id: app
        env:
          APP: ${{ inputs.app }}
        run: tiro-build-tooling/scripts/publish.sh check-app --app "$APP"

      - name: Download image
        if: steps.app.outputs.publish == 'true'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: tiro-image
          path: ${{ runner.temp }}/image

      - name: Load image
        if: steps.app.outputs.publish == 'true'
        run: docker load --input "$RUNNER_TEMP/image/image.tar.gz"

      - name: Sign in as the app's deploy account
        if: steps.app.outputs.publish == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/249607650777/locations/global/workloadIdentityPools/github-actions/providers/github-oidc
          service_account: deploy-${{ inputs.app }}@ehr-factory-apps.iam.gserviceaccount.com

      - name: Set up gcloud
        if: steps.app.outputs.publish == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Push and roll out
        if: steps.app.outputs.publish == 'true'
        env:
          APP: ${{ inputs.app }}
          IMAGE: ${{ needs.build.outputs.image }}
        run: tiro-build-tooling/scripts/publish.sh deploy --app "$APP" --image "$IMAGE" --tag "$GITHUB_SHA"
