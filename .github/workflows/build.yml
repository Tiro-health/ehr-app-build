# Checks and builds an app for tirohealth.app, and hands the image to Tiro Deploy.
#
# The app repo calls it from its own workflow:
#
#   name: Build
#   on:
#     push:
#       branches: [main]
#       tags: ["v*"]
#     pull_request:
#   jobs:
#     build:
#       uses: Tiro-health/ehr-app-build/.github/workflows/build.yml@v2
#
# This workflow needs no secrets and no access to Google Cloud. It runs `check` and `build`,
# packages the output into an image with scripts/package.sh (run it from an app repository to
# get the same image locally), and, on pushes to main or v* tags, uploads it as the
# artifact `tiro-image` (kept one day). Tiro Deploy downloads it after the run succeeds,
# checks the repository is approved, and deploys it. Pull requests are checked and built
# but not uploaded.
#
# Build contract:
# - npm (package-lock.json) or pnpm (pnpm-lock.yaml, version from "packageManager").
# - "check" and "build" scripts. Both must pass.
# - The build produces .output/server/index.mjs (Node server, e.g. TanStack Start with
#   Nitro, listening on $PORT) or dist/index.html (static single-page app, served by nginx
#   with unknown paths falling back to index.html).

name: Build app

on:
  workflow_call:
    inputs:
      tooling-ref:
        description: Ref of Tiro-health/ehr-app-build to take scripts/package.sh from.
        type: string
        default: v2

permissions:
  contents: read

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # Its automatic cache needs pnpm installed first; corepack installs it below.
          package-manager-cache: false

      - name: Install
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            echo "RUN=pnpm" >> "$GITHUB_ENV"
            pnpm install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            echo "RUN=npm run" >> "$GITHUB_ENV"
            npm ci
          else
            echo "::error::No pnpm-lock.yaml or package-lock.json found."
            exit 1
          fi

      - name: Check
        run: $RUN check

      - name: Build
        run: $RUN build

      # scripts/package.sh lives in this repository; the same script builds the image on a laptop.
      - uses: actions/checkout@v5
        with:
          repository: Tiro-health/ehr-app-build
          ref: ${{ inputs.tooling-ref }}
          path: tiro-build-tooling
          persist-credentials: false

      - name: Package image
        run: |
          # <repository>:<tag> for a v* tag, <repository>:<commit> otherwise.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then version="$GITHUB_REF_NAME"; else version="$GITHUB_SHA"; fi
          tiro-build-tooling/scripts/package.sh \
            --image "${GITHUB_REPOSITORY#*/}:$version" \
            --tar "$RUNNER_TEMP/out/image.tar.gz"

      - name: Hand the image to Tiro Deploy
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v4
        with:
          name: tiro-image
          path: ${{ runner.temp }}/out/image.tar.gz
          retention-days: 1
          # Already gzipped.
          compression-level: 0
