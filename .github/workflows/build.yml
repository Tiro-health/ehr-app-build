# Checks and builds an app for tirohealth.app, and hands the image to Tiro Deploy.
#
# The app repo calls it from its own workflow:
#
#   name: Build
#   on:
#     push:
#       branches: [main]
#       tags: ["v*"]
#     pull_request:
#   jobs:
#     build:
#       uses: Tiro-health/ehr-app-build/.github/workflows/build.yml@v1
#
# This workflow needs no secrets and no access to Google Cloud. It runs `check` and `build`,
# packages the output into an image, and, on pushes to main or v* tags, uploads it as the
# artifact `tiro-image` (kept one day). Tiro Deploy downloads it after the run succeeds,
# checks the repository is approved, and deploys it. Pull requests are checked and built
# but not uploaded.
#
# Build contract:
# - npm (package-lock.json) or pnpm (pnpm-lock.yaml, version from "packageManager").
# - "check" and "build" scripts. Both must pass.
# - The build produces .output/server/index.mjs (Node server, e.g. TanStack Start with
#   Nitro, listening on $PORT) or dist/index.html (static single-page app, served by nginx
#   with unknown paths falling back to index.html).

name: Build app

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # Its automatic cache needs pnpm installed first; corepack installs it below.
          package-manager-cache: false

      - name: Install
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            echo "RUN=pnpm" >> "$GITHUB_ENV"
            pnpm install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            echo "RUN=npm run" >> "$GITHUB_ENV"
            npm ci
          else
            echo "::error::No pnpm-lock.yaml or package-lock.json found."
            exit 1
          fi

      - name: Check
        run: $RUN check

      - name: Build
        run: $RUN build

      - name: Package image
        run: |
          ctx="$RUNNER_TEMP/image"
          mkdir -p "$ctx"
          if [ -f .output/server/index.mjs ]; then
            echo "Serving as a Node server (.output)"
            cp -R .output "$ctx/.output"
            cat > "$ctx/Dockerfile" <<'DOCKERFILE'
          FROM node:22-slim
          WORKDIR /app
          ENV NODE_ENV=production
          COPY .output ./.output
          USER node
          CMD ["node", ".output/server/index.mjs"]
          DOCKERFILE
          elif [ -f dist/index.html ]; then
            echo "Serving as a static site (dist)"
            cp -R dist "$ctx/site"
            cat > "$ctx/default.conf" <<'NGINX'
          server {
            listen 8080;
            root /usr/share/nginx/html;

            location / {
              try_files $uri $uri/ /index.html;
              add_header Cache-Control "no-cache";
            }

            location /assets/ {
              add_header Cache-Control "public, max-age=31536000, immutable";
            }
          }
          NGINX
            cat > "$ctx/Dockerfile" <<'DOCKERFILE'
          FROM nginxinc/nginx-unprivileged:1-alpine
          COPY default.conf /etc/nginx/conf.d/default.conf
          COPY site /usr/share/nginx/html
          DOCKERFILE
          else
            echo "::error::The build produced neither .output/server/index.mjs nor dist/index.html."
            exit 1
          fi

          # <repository>:<tag> for a v* tag, <repository>:<commit> otherwise.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then version="$GITHUB_REF_NAME"; else version="$GITHUB_SHA"; fi
          image="${GITHUB_REPOSITORY#*/}:$version"
          image="$(echo "$image" | tr '[:upper:]' '[:lower:]')"
          docker build --platform linux/amd64 --tag "$image" "$ctx"
          mkdir -p "$RUNNER_TEMP/out"
          docker save "$image" | gzip > "$RUNNER_TEMP/out/image.tar.gz"
          echo "Built $image ($(du -h "$RUNNER_TEMP/out/image.tar.gz" | cut -f1))"

      - name: Hand the image to Tiro Deploy
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v4
        with:
          name: tiro-image
          path: ${{ runner.temp }}/out/image.tar.gz
          retention-days: 1
          # Already gzipped.
          compression-level: 0
